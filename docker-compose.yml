# meraat.piqagram.ir - Laravel 5.6 + PHP 7.4 + MariaDB 10.4 + nginx
#
#   docker compose up -d --build     ->  http://localhost:8080
#
# The database is seeded from ./inbox.sql the first time the db volume is
# created: MariaDB imports /docker-entrypoint-initdb.d only into an EMPTY data
# directory. To wipe and re-import:  docker compose down -v
services:
  app:
    build: .
    image: meraat-app
    container_name: meraat-app
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-inbox}
      DB_USERNAME: ${DB_USERNAME:-meraat_user}
      DB_PASSWORD: ${DB_PASSWORD:-meraat_pass}
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs `php artisan schedule:run` once a minute. There is no cron daemon in
  # the container, and Laravel's daily database backup lives in
  # app/Console/Kernel.php (db:backup at 03:00 Tehran time).
  scheduler:
    image: meraat-app
    container_name: meraat-scheduler
    working_dir: /var/www/html
    entrypoint: ["sh", "-c", "while true; do php artisan schedule:run || true; sleep 60; done"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-inbox}
      DB_USERNAME: ${DB_USERNAME:-meraat_user}
      DB_PASSWORD: ${DB_PASSWORD:-meraat_pass}
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env:ro
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.24-alpine
    container_name: meraat-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:10.4
    container_name: meraat-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inbox}
      MYSQL_USER: ${DB_USERNAME:-meraat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-meraat_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-meraat_root_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./inbox.sql:/docker-entrypoint-initdb.d/01-inbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  db_data:
