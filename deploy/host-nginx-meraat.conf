# meraat.piqagram.ir - vhost روی nginx خود سرور.
#
# این فایل در استک داکر نیست؛ روی سرور و در nginx بومی اوبونتو قرار می‌گیرد تا
# پورت‌های 80/443 و گواهی TLS (و تمدید خودکار certbot) دست‌نخورده بمانند و
# ترافیک به کانتینر روی 127.0.0.1:8080 برود.
#
# با کاربر root (یا معادلش) روی سرور:
#
#   cp /srv/meraat/deploy/host-nginx-meraat.conf /etc/nginx/sites-available/meraat.piqagram.ir
#   ln -s /etc/nginx/sites-available/meraat.piqagram.ir /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# قبل از فعال کردن، vhost قدیمی همین دامنه را غیرفعال کن (unlink از
# sites-enabled) وگرنه دو server block برای یک server_name تعریف می‌شود و
# nginx اولی را انتخاب می‌کند.
#
# مسیر گواهی‌ها را از vhost فعلی خودت کپی کن؛ اگر با certbot ساخته شده باشد
# همان /etc/letsencrypt/live/<domain>/ است.

server {
    listen 80;
    listen [::]:80;
    server_name meraat.piqagram.ir;

    # تمدید گواهی certbot باید از همین‌جا کار کند.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meraat.piqagram.ir;

    ssl_certificate     /etc/letsencrypt/live/meraat.piqagram.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meraat.piqagram.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # آپلود عکس پرسنل تا ۱۲ مگابایت (هم‌خوان با client_max_body_size و
    # upload_max_filesize داخل کانتینر).
    client_max_body_size 12m;

    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # چاپ جدول‌ها و گرفتن بکاپ ممکن است طول بکشد.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
    }
}
