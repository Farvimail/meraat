# meraat.piqagram.ir - vhost روی nginx خود سرور.
#
# این فایل داخل استک داکر نیست؛ روی سرور و در nginx بومی اوبونتو مینشیند تا
# پورتهای 80/443 و گواهی TLS (و تمدید خودکار certbot) دستنخورده بمانند و
# ترافیک به کانتینر روی 127.0.0.1:8080 برود.
#
# نصب (یک دستور، با sudo):
#
#   cd /home/ghafari/meraat && ./deploy/cutover.sh
#
# یا دستی:
#
#   sudo cp /etc/nginx/sites-available/meraat.piqagram.ir \
#           /etc/nginx/sites-available/meraat.piqagram.ir.bak-$(date +%F-%H%M%S)
#   sudo cp deploy/host-nginx-meraat.conf \
#           /etc/nginx/sites-available/meraat.piqagram.ir
#   sudo nginx -t && sudo systemctl reload nginx
#
# بازگشت به حالت قبل:
#
#   sudo cp /etc/nginx/sites-available/meraat.piqagram.ir.bak-<تاریخ> \
#           /etc/nginx/sites-available/meraat.piqagram.ir
#   sudo systemctl reload nginx
#
# نکته: در این سرور certbot با authenticator = nginx کار میکند (نه webroot)،
# پس بلوک acme-challenge لازم نیست؛ ولی نگه داشته شده تا تمدید webroot هم
# کار کند. مسیر گواهیها همان مسیر مدیریتشده توسط certbot است.

server {
    listen 80;
    server_name meraat.piqagram.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # همه چیز به https میرود. عمداً snippets/phpmyadmin.conf اینجا include
    # نشده: نسخهی قدیمی آن را در بلوک http هم میگذاشت و phpMyAdmin روی
    # HTTP خام سرو میشد.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name meraat.piqagram.ir;

    ssl_certificate     /etc/letsencrypt/live/meraat.piqagram.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meraat.piqagram.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # phpMyAdmin روی خود میزبان میماند و از سوکت php7.4-fpm سیستمی استفاده
    # میکند؛ ربطی به استک داکر ندارد و باید سر جایش بماند.
    include snippets/phpmyadmin.conf;

    # آپلود عکس پرسنل تا ۱۲ مگابایت (همخوان با client_max_body_size و
    # upload_max_filesize داخل کانتینر).
    client_max_body_size 12m;

    # هیچ root محلی تعریف نشده: تمام درخواستها به کانتینر میرود. اگر root
    # قدیمی (/var/www/meraat.piqagram.ir/public) اینجا میماند، فایلهای
    # استاتیک از درخت کد قدیمی سرو میشدند و کد جدید هرگز دیده نمیشد.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # چاپ جدولها و گرفتن بکاپ ممکن است طول بکشد.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # امنیت فایلهای مخفی
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
