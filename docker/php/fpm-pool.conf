[www]
; Pass the container environment through to the PHP workers. Without this
; php-fpm clears every variable and the app can only be configured through a
; .env file.
clear_env = no

; This is a small, single-server deployment: keep the worker count predictable
; instead of letting fpm size the pool from the host's CPU count.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
