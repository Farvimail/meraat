[www]
; Pass the container environment through to the PHP workers. Without this
; php-fpm clears every variable and the app can only be configured through a
; .env file.
clear_env = no

; meraat shares its host with several other dockerised sites and the box has
; only 3.7 GB of RAM with well under 1 GB free. The app serves a single company
; of ~20 people, so a small, strictly bounded pool is the right trade-off: if
; meraat ever runs away it should slow itself down rather than starve the
; other tenants on the machine.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; The nginx vhost waits 120s for fastcgi; a worker that has been busy longer
; than that is wedged, not slow.
request_terminate_timeout = 130s
